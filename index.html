<style>
:root{
  --noche:#F7EEE2; --panel:#FFFCF6; --panel2:#FBF2E6; --linea:#DFC9AE; --tinta:#33241C; --tenue:#7C6553;
  --oro:#A8661B; --morado:#8A6A9E; --rojo:#B0442C; --verde:#4F7A2E;
  --sombra:rgba(70,40,20,.22); --brillo:rgba(214,150,50,.18);
  --fresa:#C97E8C; --fresaO:#A3505F; --pistacho:#6F7E33; --chocolate:#5A3A28; --caramelo:#C98A3E; --nata:#FFF8EC; --estraza:#E3C9A0;
  --fondo1:#F2E8DA; --fondo2:#E4D3BE; --luz:rgba(255,250,238,.8);
  --rotulo:'Yeseva One',Georgia,serif; --letra:'Atkinson Hyperlegible',system-ui,sans-serif; --mono:'Space Mono',ui-monospace,monospace;
  --grano:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .18  0 0 0 .5 0'/></filter><rect width='240' height='240' filter='url(%23g)' opacity='.22'/></svg>");
  --baldosa:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='112' height='112' viewBox='0 0 112 112'><g opacity='.13'><g fill='none' stroke='%23874A3E' stroke-width='1.1'><rect x='.5' y='.5' width='111' height='111'/><circle r='26'/><circle cx='112' r='26'/><circle cy='112' r='26'/><circle cx='112' cy='112' r='26'/><circle cx='56' cy='56' r='31'/></g><g fill='%23B4606F'><path d='M56 27 C64 40 64 47 56 56 C48 47 48 40 56 27Z'/><path d='M56 85 C48 72 48 65 56 56 C64 65 64 72 56 85Z'/><path d='M27 56 C40 48 47 48 56 56 C47 64 40 64 27 56Z'/><path d='M85 56 C72 64 65 64 56 56 C65 48 72 48 85 56Z'/></g><g fill='%23A86A2A'><circle cx='56' cy='56' r='4.5'/><circle cx='0' cy='0' r='8'/><circle cx='112' cy='0' r='8'/><circle cx='0' cy='112' r='8'/><circle cx='112' cy='112' r='8'/></g></g></svg>");
  --sello:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 10.5 C5 6 8.5 3.6 12 3.6 C15.5 3.6 19 6 19 10.5Z'/><circle cx='12' cy='3' r='1.9'/><path d='M4.2 11.6 H19.8 L17.6 21 H6.4Z' opacity='.75'/><path d='M8.3 12.4 L9 20 M12 12.4 V20 M15.7 12.4 L15 20' stroke='white' stroke-width='1'/></svg>");
  color-scheme:light;
}
html[data-tema="obrador"]{
  --noche:#21170F; --panel:#2E2119; --panel2:#37281F; --linea:#5C4535; --tinta:#F5E9DA; --tenue:#C9B39C;
  --oro:#E6A84A; --morado:#B79CCB; --rojo:#DE7A61; --verde:#9BBF77; --sombra:rgba(0,0,0,.5); --brillo:rgba(230,168,74,.16);
  --fresa:#E89AAA; --fresaO:#F0B3C0; --pistacho:#B5C27A; --chocolate:#E9D3BC; --caramelo:#D9A05A; --nata:#3A2B21; --estraza:#6B5038;
  --fondo1:#3A281D; --fondo2:#22170F; --luz:rgba(255,220,180,.08);
  --baldosa:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='112' height='112' viewBox='0 0 112 112'><g opacity='.08'><g fill='none' stroke='%23F0C9A0' stroke-width='1.1'><rect x='.5' y='.5' width='111' height='111'/><circle r='26'/><circle cx='112' r='26'/><circle cy='112' r='26'/><circle cx='112' cy='112' r='26'/><circle cx='56' cy='56' r='31'/></g><g fill='%23E89AAA'><path d='M56 27 C64 40 64 47 56 56 C48 47 48 40 56 27Z'/><path d='M56 85 C48 72 48 65 56 56 C64 65 64 72 56 85Z'/><path d='M27 56 C40 48 47 48 56 56 C47 64 40 64 27 56Z'/><path d='M85 56 C72 64 65 64 56 56 C65 48 72 48 85 56Z'/></g><g fill='%23E6A84A'><circle cx='56' cy='56' r='4.5'/><circle cx='0' cy='0' r='8'/><circle cx='112' cy='0' r='8'/><circle cx='0' cy='112' r='8'/><circle cx='112' cy='112' r='8'/></g></g></svg>");
  color-scheme:dark}
html[data-tema="proyector"]{
  --noche:#F4F4F4; --panel:#FFFFFF; --panel2:#FFFFFF; --linea:#1A1A1A; --tinta:#000; --tenue:#2B2B2B;
  --oro:#8A5A00; --rojo:#B3261E; --verde:#1D6B12; --fresa:#B04F64; --fresaO:#8E2F45; --pistacho:#3F5A12; --nata:#FFFFFF; --estraza:#EFE3CF;
  --chocolate:#1A1A1A; --sombra:rgba(0,0,0,.12); --brillo:rgba(138,90,0,.10); --fondo1:#FFFFFF; --fondo2:#FFFFFF; --luz:transparent; --baldosa:none; --grano:none}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{background:var(--fondo2);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;color:var(--tinta);font:15px/1.5 var(--letra);min-height:100vh;overflow-x:hidden;
  background:radial-gradient(ellipse 90% 55% at 50% 0%, var(--luz), transparent 70%), var(--grano), var(--baldosa), linear-gradient(180deg, var(--fondo1), var(--fondo2));
  background-size:auto, 240px 240px, 112px 112px, auto;
  background-attachment:fixed;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
html[data-tema="proyector"] body{background:#FFFFFF}
.lienzo{max-width:760px;margin:0 auto;padding:12px 12px 36px;display:flex;flex-direction:column}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tenue{color:var(--tenue)}
html[data-movimiento="menos"] *, html[data-movimiento="menos"] *::before, html[data-movimiento="menos"] *::after{animation-duration:.001ms !important;animation-delay:0s !important;transition-duration:.001ms !important}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:.001ms !important;animation-delay:0s !important;transition-duration:.001ms !important}
}

.cab{border:1px solid var(--linea);border-radius:13px;overflow:hidden;
  background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 6px 18px var(--sombra)}
.rotulo{display:flex;align-items:center;gap:10px 16px;padding:11px 14px 9px}
.rotulo .nombre{flex:1 1 auto;min-width:0}
.cab .sello{width:26px;height:26px;flex:0 0 26px;background:var(--oro);
  -webkit-mask:var(--sello) center/contain no-repeat;mask:var(--sello) center/contain no-repeat}
.cab h1{font:400 19px/1.1 var(--rotulo);letter-spacing:1.6px;text-transform:uppercase;margin:0;color:var(--oro);white-space:nowrap}
.cab .sub{font:700 9.5px/1.3 var(--mono);letter-spacing:1.3px;text-transform:uppercase;color:var(--tenue);margin:3px 0 0}
.cab .acc{margin-left:auto;display:flex;gap:12px;align-items:center;flex:0 0 auto}
.cab .acc button{font:400 11px/1 var(--rotulo);letter-spacing:1.1px;text-transform:uppercase;color:var(--tenue);
  background:none;border:0;border-bottom:2px solid transparent;padding:7px 0 5px;cursor:pointer;min-height:30px}
.cab .acc button:focus-visible,.cab .acc button[aria-pressed="true"]{color:var(--oro);border-bottom-color:var(--oro);outline:none}
@media (hover:hover){ .cab .acc button:hover{color:var(--oro);border-bottom-color:var(--oro)} .juegos button:hover{background:var(--brillo)} }
.cab .acc .mic{display:grid;place-items:center;padding:4px 2px}
.cab .acc .micro{width:14px;height:18px;display:block}
.juegos{display:grid;grid-template-columns:repeat(var(--n,4),1fr);border-top:1px solid var(--linea)}
.juegos button{font:inherit;cursor:pointer;text-align:center;color:var(--tinta);background:none;border:0;border-bottom:3px solid transparent;
  border-radius:0;padding:9px 6px 8px;line-height:1.2;min-height:44px;min-width:0}
.juegos button + button{border-left:1px solid var(--linea)}
.juegos button b{display:block;font:400 13.5px/1.15 var(--rotulo);letter-spacing:1.3px;text-transform:uppercase;color:var(--oro)}
.juegos button span{display:block;font-size:11.5px;color:var(--tenue);margin-top:3px}
.juegos button[aria-pressed="true"]{border-bottom-color:var(--oro);background:var(--brillo)}
@media (max-width:620px){
  .rotulo{flex-wrap:wrap;row-gap:4px;padding:9px 12px 0}
  .rotulo .nombre{flex:1 1 0}
  .cab .acc{width:100%;margin:0;padding:1px 0 2px;border-top:1px solid var(--linea);justify-content:space-between;gap:4px}
  .cab .acc button{font-size:11px;letter-spacing:1px;min-height:38px;padding:9px 0 7px}
}
@media (max-width:480px){
  .cab .sub{font-size:8px;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .capa{display:none}
  .cab h1{font-size:16px;letter-spacing:1px}
  .juegos button span{display:none}
  .juegos button b{font-size:11.5px;letter-spacing:.6px}
  .juegos button{padding:8px 3px 6px;min-height:40px}
}
@media (max-width:360px){ .cab .acc button{letter-spacing:.4px;font-size:10.5px} }
@media (max-width:480px){
  .juegos{grid-template-columns:repeat(var(--n,4),auto)}
  .juegos button{padding:8px 2px 6px}
  .juegos button b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;letter-spacing:.3px}
}

.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--linea);border-radius:13px;
  padding:12px 13px;margin-top:9px;box-shadow:0 6px 18px var(--sombra);min-width:0}
.etq{font:700 9.5px/1.2 var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--tenue)}
.caja{background:var(--noche);border:1px solid var(--linea);border-radius:12px;padding:9px 11px;min-width:0}
.caja > h4{margin:0 0 6px;font:700 9.5px/1 var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--tenue)}

.botones{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;justify-content:flex-end}
.botones:empty{display:none}
button.b{font:400 13px/1 var(--rotulo);letter-spacing:1.2px;text-transform:uppercase;
  padding:8px 14px;min-height:42px;border-radius:9px;border:1px solid var(--linea);cursor:pointer;
  background:linear-gradient(180deg,var(--panel2),var(--panel));color:var(--tinta);box-shadow:0 2px 0 rgba(0,0,0,.28)}
button.b:hover{border-color:var(--morado)}
button.b:active{transform:translateY(2px);box-shadow:none}
button.b.ok{background:linear-gradient(180deg,#F4CB72,#DDA23A);color:#2A1D06;border-color:#A8661B;box-shadow:0 2px 0 #7E4C12}
button.b[aria-pressed="true"]{border-color:var(--oro);color:var(--oro)}
button.b:disabled{opacity:.4;cursor:default;transform:none}
button.b.borrar.seguro{background:var(--rojo);border-color:var(--rojo);color:#fff}
button.b.chico{min-height:42px;min-width:42px;padding:6px 10px}
button.enlace{background:none;border:0;color:var(--tenue);text-decoration:underline;text-underline-offset:3px;font:inherit;font-size:13px;cursor:pointer;padding:8px 4px;min-height:36px}
button.enlace:hover{color:var(--oro)}

.ops{display:inline-flex;border:1px solid var(--linea);border-radius:20px;overflow:hidden;flex-wrap:wrap;background:var(--panel)}
.ops button{font:400 12px/1 var(--rotulo);letter-spacing:1px;text-transform:uppercase;cursor:pointer;
  background:none;border:0;color:var(--tenue);padding:8px 12px;min-height:38px}
.ops button + button{border-left:1px solid var(--linea)}
.ops button[aria-pressed="true"]{background:var(--oro);color:var(--panel)}
.ops.ops-filas{display:flex;width:100%;border-radius:16px}
.ops.ops-filas button{flex:1 1 calc(100% / var(--por-fila, 3));border-left:0;box-shadow:-1px -1px 0 var(--linea)}

.ajustes .aj{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;padding:7px 0;border-bottom:1px dashed var(--linea)}
.ajustes .aj > .etq{min-width:120px}
.ajustes .aj small{flex-basis:100%;color:var(--tenue);font-size:12.5px;line-height:1.4}
.aj-grupo{padding:4px 0}
.aj-grupo > summary{cursor:pointer;font:700 10px/1 var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--tenue);padding:12px 0}

.ruta{display:flex;align-items:center;gap:8px;margin-bottom:9px;min-height:30px}
.rt-mision{font:700 10.5px/1.25 var(--mono);letter-spacing:1.3px;text-transform:uppercase;color:var(--tenue);min-width:0}
.rt-mision b{color:var(--tinta)}
.ruta .rt-mision{flex:1 1 auto}
.capa{font:700 9px/1 var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--oro);border:1px solid var(--oro);border-radius:20px;padding:3px 7px;white-space:nowrap;opacity:.85}
.capa:empty{display:none}
.puntos{display:flex;gap:0;align-items:center;flex-wrap:nowrap}
.puntos button{background:none;border:0;padding:0;width:17px;height:30px;display:grid;place-items:center;cursor:pointer}
.puntos i{width:9px;height:9px;border-radius:50%;background:var(--linea);display:block}
.puntos .hecha i{background:var(--oro)}
.puntos .aqui i{background:none;box-shadow:inset 0 0 0 2px var(--oro)}
.puntos .hecha.aqui i{background:var(--oro);box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--oro)}
.curso2{font:700 9px/1 var(--mono);font-style:normal;letter-spacing:.5px;color:var(--fresaO);border:1px solid currentColor;border-radius:3px;padding:1px 3px;vertical-align:1px;opacity:.85}
.rt-corto{display:none}
@media (max-width:620px){
  .ruta{gap:4px;min-height:28px;margin-bottom:7px}
  .ruta .rt-mision{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px;flex:1 1 0}
  .rt-largo{display:none} .rt-corto{display:inline}
  .puntos{flex-wrap:nowrap;flex:0 0 auto}
  .puntos button{width:13px;height:28px}
  .puntos i{width:7px;height:7px}
  .rt-flecha{width:26px;flex-basis:26px;height:28px}
}
.rt-flecha{background:none;border:1px solid transparent;border-radius:8px;color:var(--tenue);font:400 20px/1 var(--letra);width:30px;height:30px;cursor:pointer;flex:0 0 30px}
.rt-flecha:hover:not(:disabled){border-color:var(--linea);color:var(--oro)}
.rt-flecha:disabled{opacity:.25;cursor:default}
.practica{margin-bottom:9px}
.pr-cab{display:flex;align-items:center;gap:10px;min-height:34px}
.pr-cab .rt-mision{flex:1}
.pr-reloj{font:700 16px/1 var(--mono);color:var(--oro);letter-spacing:1px;font-variant-numeric:tabular-nums}
.pr-fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:4px}
.pr-fila:not(:has(.ops:not([hidden]))){display:none}
.pr-tipos{max-width:100%}

.habla{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;background:var(--noche);border:1px solid var(--linea);border-radius:12px;padding:9px 11px}
.habla .cara{width:44px;height:44px;border-radius:50%;background:var(--panel);border:1px solid var(--linea);overflow:hidden;display:grid;place-items:center;
  font:400 18px/1 var(--rotulo);color:var(--oro)}
.habla .cara svg{width:100%;height:100%;display:block}
.habla em{display:block;font:400 11px/1.2 var(--rotulo);font-style:normal;letter-spacing:1.3px;text-transform:uppercase;color:var(--oro);margin-bottom:3px}
.habla p{margin:0;font-size:15.5px;line-height:1.42}
.habla p b{color:var(--fresaO)}
.habla .dice{min-width:0}
.habla.feliz .cara{box-shadow:0 0 0 2px var(--oro)}

.modal{position:fixed;inset:0;background:rgba(12,8,20,.82);display:grid;place-items:center;padding:16px;z-index:60;overflow:auto}
.modal .caja2{width:min(600px,100%);max-height:calc(100dvh - 32px);overflow:auto;border:1px solid var(--linea);border-radius:16px;padding:18px 20px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 24px 60px rgba(0,0,0,.55);color:var(--tinta)}
.modal .caja2:focus{outline:none}
.modal h2{font:400 18px/1.2 var(--rotulo);color:var(--oro);letter-spacing:1.5px;text-transform:uppercase;margin:0 0 6px}
.modal h3{font:400 13px/1.2 var(--rotulo);color:var(--oro);letter-spacing:1.2px;text-transform:uppercase;margin:14px 0 6px}
.modal p,.modal li{font-size:14.5px}
.acta-cab{display:flex;gap:14px;align-items:flex-start}
.acta-cab > div:first-child{flex:1}
.actaSub{margin:0 0 10px;color:var(--tenue)}
.acta-sello{flex:0 0 96px;text-align:center;transform:rotate(3deg)}
.acta-sello svg{width:52px;height:auto;display:block;margin:0 auto 2px}
.acta-sello b{display:block;font:400 11.5px/1.15 var(--rotulo);letter-spacing:1px;text-transform:uppercase;color:var(--oro)}
.acta-sello small{display:block;font-size:11px;color:var(--tenue)}
.actaNombre{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.actaNombre input{flex:1;min-width:120px;font:16px var(--mono);padding:8px 10px;border-radius:9px;border:1px solid var(--linea);background:var(--noche);color:var(--tinta)}
.actaDatos{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px;margin-bottom:10px}
.actaDatos div{background:var(--noche);border:1px solid var(--linea);border-radius:9px;padding:6px 9px}
.actaDatos b{display:block;font:700 18px/1.3 var(--mono)}
.actaTabla{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:8px}
.actaTabla th{font:700 9.5px/1.2 var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--tenue);text-align:left;padding:4px 6px;border-bottom:1px solid var(--linea)}
.actaTabla td{padding:6px;border-bottom:1px dashed var(--linea);vertical-align:top}
.actaTabla td b{color:var(--oro);font-weight:400;font-family:var(--rotulo);letter-spacing:.6px}
.ac-capas{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:13.5px;margin:6px 0}
.ac-capa b{font-family:var(--mono);color:var(--oro)}
.ac-errores{list-style:none;margin:0;padding:0}
.ac-errores li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--linea)}
.ac-errores b{color:var(--rojo);font-weight:700}
.ac-errores span{font-family:var(--mono)}
.actaCodigos{display:flex;align-items:center;gap:10px;margin:10px 0 2px}
.actaCodigos b{font:700 18px/1 var(--mono);letter-spacing:2px;color:var(--oro)}
.actaMsg{min-height:20px;color:var(--verde);margin:6px 0 0}
.ac-det{margin:8px 0 0} .ac-det summary{cursor:pointer;color:var(--tenue);font-size:13.5px;padding:6px 0}
.ac-ej{margin:6px 0 0;padding-left:0;list-style:none;font-size:13px}
.ac-ej li{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed var(--linea);flex-wrap:wrap}
.ac-ej .ac-h{font-family:var(--mono);color:var(--tenue);font-size:11px;min-width:44px}
.ac-ej .ac-c{font-family:var(--mono)}
.ac-ej li.ok .ac-como::before{content:"✓ ";color:var(--verde)} .ac-ej li.no .ac-como::before{content:"✗ ";color:var(--rojo)}
.entrevista .ev-quien{margin:4px 0 6px}
.ev-cartel{margin:0 0 8px;color:var(--tenue);font-size:13.5px}
.ev-escena{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start}
.ev-cara{width:72px;height:72px;border-radius:50%;background:var(--noche);border:1px solid var(--linea);overflow:hidden;display:grid;place-items:center;font:400 26px/1 var(--rotulo);color:var(--oro)}
.ev-cara svg{width:100%;height:100%;display:block}
.ev-globo{background:var(--noche);border:1px solid var(--linea);border-radius:12px;padding:10px 12px;min-height:72px}
.ev-pregunta{margin:0 0 4px;font-weight:700}
.ev-respuesta{margin:0;line-height:1.5}

Glosario.abre = palabra => {

  $('glLista').innerHTML = entradas.map(x => '<div class="gl-entrada" data-t="' + esc(x.t) + '"><dt>' + esc(x.t) + '</dt><dd>' + esc(x.d) +

  $('mGlosario').querySelector('.caja2').focus();
  if(palabra){ const e = $('glLista').querySelector('[data-t="' + esc(palabra) + '"]'); if(e) e.scrollIntoView({block: 'center'}); }
};
Glosario.cierra = () => { const d = $('mGlosario'); if(!d || d.hidden) return; d.hidden = true; if(deDonde && deDonde.focus) deDonde.focus({preventScroll: true}); };
Glosario.abierto = () => !!(montado && !$('mGlosario').hidden);

raiz.Glosario = Glosario;
if(typeof module !== 'undefined' && module.exports) module.exports = Glosario;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
(function (raiz) {

H.LISTA = [
  {id: 'grapadora', n: 'la grapadora de Nick', t: 'Un minuto quieto y asoma Nick, con la grapadora. Siempre viene a sumar algo.'},
  {id: 'docena', n: 'la docena del panadero', t: 'Trece magdalenas: la docena del panadero. Una de más, para que nadie diga que se quedó corto.'},

  {id: 'gratis', n: 'el cartel de gratis', t: 'Un cartel del −100 %: por 0. No queda nada que pagar, y Nicoleta no lo cuelga nunca.'},

const MIGAS_DICE = ['El 100 % de las migas son mías.', 'Media magdalena es el 50 %. Lo he comprobado.', 'Si Nick suma, yo resto.',
  'De cada cien cuadraditos, me como el que sobra.', 'Fibonacci. Escríbelo. Yo no sé escribir.'];
const NICK_DICE = ['Vengo a grapar presupuestos. ¿Hay que sumar algo?', 'Para el doble de magdalenas yo pondría el doble de horno. Y el doble de mí.',
  'Mi hermana dice que no se suma. Yo sumo. Por eso ella hace tartas y yo pizzas.', '¿Un 20 % de qué? De la pizza, siempre de la pizza.'];

H.svgFibonacci = () => {
  const t = (x, y, s, a) => '<text x="' + x + '" y="' + y + '"' + (a || '') + '>' + s + '</text>';
  return '<svg class="fb-svg" viewBox="0 0 540 330" role="img" aria-label="La regla de tres del Liber Abaci, como la escribía Leonardo y como la hace Nicoleta">' +
    t(20, 22, 'cien rollos, cuarenta libras; cinco rollos, ¿cuánto?', ' class="fb-tit"') +
    t(20, 52, 'COMO LEONARDO, 1202', ' class="fb-etq"') +
    '<rect x="20" y="62" width="240" height="112" rx="8" class="fb-papel"/>' +
    t(60, 106, '40', ' class="fb-n"') + t(150, 106, '100', ' class="fb-n"') + t(205, 148, '5', ' class="fb-n"') + t(60, 148, '?', ' class="fb-n fb-busca"') +
    t(60, 124, 'libras', ' class="fb-u"') + t(150, 124, 'rollos', ' class="fb-u"') + t(205, 166, 'rollos', ' class="fb-u"') + t(60, 166, 'libras', ' class="fb-u"') +
    '<path d="M80 100 L198 138" class="fb-cruz"/><path d="M168 100 L80 138" class="fb-cruz fb-cruz2"/>' +
    '<foreignObject x="20" y="184" width="240" height="86"><p xmlns="http://www.w3.org/1999/xhtml" class="fb-p">«Multiplica el que está enfrente por el del extremo, y divide por el que queda»: 40 · 5 : 100. Dos libras.</p></foreignObject>' +
    t(290, 52, 'COMO NICOLETA', ' class="fb-etq"') +
    '<rect x="290" y="62" width="230" height="112" rx="8" class="fb-nata"/>' +
    t(304, 92, '100 rollos = 40 libras', ' class="fb-r"') +
    t(304, 122, '1 rollo = 40 : 100 = 0,4', ' class="fb-r fb-uno"') +
    t(304, 152, '5 rollos = 5 · 0,4 = 2', ' class="fb-r fb-sol"') +
    '<foreignObject x="290" y="184" width="230" height="86"><p xmlns="http://www.w3.org/1999/xhtml" class="fb-p">La misma cuenta: : 100 y · 5, en el orden que se quiera. Leonardo, en cruz; Nicoleta pasa por uno, porque no se olvida.</p></foreignObject>' +
    t(20, 290, 'DE DÓNDE SALE EL SIGNO', ' class="fb-etq"') +
    t(20, 320, 'per cento', ' class="fb-h fb-it"') + t(118, 320, '→', ' class="fb-u"') + t(142, 320, 'p c°', ' class="fb-h"') + t(198, 320, '→', ' class="fb-u"') +
    t(222, 320, 'p ⁰⁄₀', ' class="fb-h"') + t(282, 320, '→', ' class="fb-u"') + t(306, 322, '%', ' class="fb-h fb-por"') +
    t(350, 320, 'siglos XV al XVII', ' class="fb-u"') + '</svg>';
};

if(!raiz.document){ raiz.Hallazgos = H; if(typeof module !== 'undefined' && module.exports) module.exports = H; return; }
const T = (k, d) => (raiz.T ? raiz.T(k, d) : k);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
let conex = {est: () => null, guarda: () => {}};
H.conecta = c => { conex = Object.assign(conex, c || {}); };

let tPapel = 0;
function papel(h){
  let p = $('hallazgoPapel');
  if(!p){ p = document.createElement('div'); p.id = 'hallazgoPapel'; p.className = 'hallazgo-papel'; p.setAttribute('role', 'status'); document.body.appendChild(p); }
  const est = conex.est(), n = H.encontrados(est).length;
  p.innerHTML = '<small>' + esc(T('hallazgo.rotulo', {i: n, n: H.LISTA.length})) + '</small><b>' + esc(h.n) + '</b><span>' + esc(h.t) + '</span>';
  p.hidden = false; p.classList.remove('va'); void p.offsetWidth; p.classList.add('va');
  clearTimeout(tPapel); tPapel = setTimeout(() => { p.hidden = true; }, 5200);
}
H.encuentra = id => {
  const h = H.de(id), est = conex.est(); if(!h || !est) return false;
  est.hallazgos = est.hallazgos || {};
  if(est.hallazgos[id]) return false;
  est.hallazgos[id] = Date.now(); conex.guarda();
  papel(h);
  return true;
};

H.abreFibonacci = por => {
  let d = $('mFibonacci');
  if(!d){
    d = document.createElement('div'); d.className = 'modal'; d.id = 'mFibonacci'; d.hidden = true;
    d.innerHTML = '<div class="caja2 fibonacci" role="dialog" aria-modal="true" aria-labelledby="fbTit" tabindex="-1">' +
      '<h2 id="fbTit">Fibonacci</h2><p class="actaSub">lo que no está en el índice</p>' +
      '<p class="fb-latin">«Si cien rollos valen cuarenta libras, ¿cuánto valen cinco rollos?»</p>' +
      '<p class="fb-trad">Leonardo de Pisa, <i>Liber Abaci</i>, 1202. El capítulo de la regla de tres, para mercaderes.</p>' +
      '<p><b>Leonardo de Pisa</b>, al que llaman Fibonacci, aprendió las cifras de los árabes en Bugía, donde su padre era aduanero, y en 1202 escribió el libro que las trajo a Europa. ' +
      'En él está la <b>regla de tres</b>, la <i>regola del tre</i>, para mercaderes: tres números que se conocen y uno que se busca. Y de esos mercaderes viene el «per cento», de donde sale el signo %.</p>' +
      '<div class="fb-escena">' + H.svgFibonacci() + '</div>' +
      '<p class="fb-nico">Nicoleta: «En el obrador nadie escribe cruces. Se pregunta cuánto vale uno, y ya.»</p>' +
      '<p class="fb-aviso tenue" id="fbPor"></p>' +
      '<div class="botones"><button type="button" class="b ok" id="fbCierra">' + esc(T('b.volver')) + '</button></div></div>';
    document.body.appendChild(d);
    const cierra = () => {
      d.hidden = true;
      const a = H._deDonde, vale = a && a.isConnected && a.offsetParent !== null && !a.closest('[hidden]');
      const otro = document.querySelector('#botones .b.ok:not([hidden])') || document.getElementById('mesa');
      try{ (vale ? a : otro).focus({preventScroll: true}); }catch(e){}
    };
    $('fbCierra').addEventListener('click', cierra);
    d.addEventListener('click', ev => { if(ev.target === d) cierra(); });
    addEventListener('keydown', ev => { if(!d.hidden && ev.key === 'Escape'){ ev.stopPropagation(); cierra(); } }, true);
  }
  $('fbPor').textContent = 'Esta sala se ha abierto por ' + (por || 'casualidad') + '. No sale en el índice.';
  if(d.hidden) H._deDonde = document.activeElement;
  d.hidden = false; d.querySelector('.caja2').focus();
  H.encuentra('fibonacci');
};

let tecleado = '', tTecleado = 0;
addEventListener('keydown', ev => {
  const a = document.activeElement;
  if(!ev.key || ev.key.length !== 1 || ev.repeat || (a && /^(INPUT|TEXTAREA)$/.test(a.tagName))) return;
  clearTimeout(tTecleado); tTecleado = setTimeout(() => { tecleado = ''; }, 2000);
  tecleado = (tecleado + ev.key.toLowerCase()).slice(-12);
  if(/fibonacci$/.test(tecleado)){ tecleado = ''; H.abreFibonacci('el nombre de Fibonacci, escrito'); }
}, true);
H.tecleando = () => { for(let i = 1; i <= Math.min(9, tecleado.length); i++) if('fibonacci'.startsWith(tecleado.slice(-i)) && (i >= 2 || tecleado.slice(-1) === 'f')) return true; return false; };
document.addEventListener('click', ev => {
  const c = ev.target.closest && ev.target.closest('.habla .cara');
  if(!c) return;
  const h = c.closest('.habla');
  if(!h || h.dataset.quien !== 'migas') return;
  c.classList.remove('salta'); void c.offsetWidth; c.classList.add('salta');
  const p = h.querySelector('.dice p');
  if(p && !p.querySelector('.migas-dice')) p.insertAdjacentHTML('beforeend', ' <span class="migas-dice">«' + esc(MIGAS_DICE[Math.floor(Math.random() * MIGAS_DICE.length)]) + '»</span>');
  H.encuentra('migas');
});
let quieto = 0, tFuera = 0;
const NICK_QUIETO = 60000;
function asoma(){
  if(document.hidden || document.querySelector('.modal:not([hidden]),.guia:not([hidden]),.historia:not([hidden]),.arranque') || document.documentElement.dataset.inicio) return arma();
  let a = $('nickAsoma');
  if(!a){ a = document.createElement('div'); a.id = 'nickAsoma'; a.className = 'nick-asoma'; a.setAttribute('role', 'status'); document.body.appendChild(a); }
  const PJ = raiz.Personajes;
  a.innerHTML = '<span class="cara" aria-hidden="true"></span><p>' + esc(NICK_DICE[Math.floor(Math.random() * NICK_DICE.length)]) + '</p>';
  if(PJ && PJ.ponCara) try{ const c = a.querySelector('.cara'); c.dataset.vb = (raiz.Habla && raiz.Habla.VB.nick) || ''; PJ.ponCara(c, 'nick', 'grapa', true); }catch(e){}
  a.hidden = false; a.classList.remove('va'); void a.offsetWidth; a.classList.add('va');
  if(raiz.Sonido) try{ raiz.Sonido.toca('papel'); }catch(e){}
  H.encuentra('grapadora');
  clearTimeout(tFuera); tFuera = setTimeout(() => { a.hidden = true; }, 6500);
}
function arma(){ clearTimeout(quieto); quieto = setTimeout(asoma, NICK_QUIETO); }
['pointerdown', 'keydown', 'scroll', 'wheel'].forEach(e => addEventListener(e, arma, {passive: true}));
arma();
H.asoma = asoma;

raiz.Hallazgos = H;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
(function (raiz) {
'use strict';

raiz.Guia.registra([
  {sel: '.rotulo', tit: 'El rótulo', t: '<b>La pastelería de Nicoleta.</b> Arriba, lo de la casa: Historia, Guía, Practicar, Ajustes, Aula, Acta y el micrófono de las entrevistas.'},
  {sel: '#juegos', tit: 'Las pestañas', t: 'Cuatro contenidos: la razón que no cambia, el producto que no cambia, de cada cien y el factor. Cada una tiene su ruta de misiones. Puedes entrar por cualquiera.'},
  {sel: '#ruta', tit: 'La ruta', t: 'Los puntos de la pestaña: cada misión, con su número. Las hechas, en dorado. Puedes volver a una.'},
  {sel: '#pide', tit: 'Liz pregunta', t: '<b>Liz Stillo</b>, del periódico, pide con la libreta abierta. Lo que pide se hace en la mesa de abajo.'},
  {sel: '#mesa', tit: 'La mesa', t: 'Lo que se toca: la ficha de la receta y su rueda, la etiqueta y los pasteles, la pantalla del horno con sus ruedas, la tarta de cien, el cartel. Nada se calcula solo: las cifras las escribes tú.'},
  {mesa: true},
  {sel: '#mesa .renglones', tit: 'Los renglones', t: 'La cuenta, en cadena de igualdades, como va al papel. Los huecos son tuyos. Es lo que vale en el examen.'},
  {sel: '#bVerRegla', otro: '#botones', tit: 'Verlo en la regla', t: 'Abre la regla doble o la bandeja para ver la cuenta dibujada. El acta apunta si lo has hecho <b>sin mirar</b>.',
    aun: 'En esta misión no hay: en las que la tienen, el botón sale aquí, junto al dorado.'},
  {sel: '#botones .b.ok', tit: 'Comprobar', t: 'El único botón dorado. Si no cuadra, Nicoleta te da una pista. Si es un error con nombre, lo dice quien lo cometería.'},
  {sel: '#mesa .rn-titular', otro: '#mesa .renglones', tit: 'El titular', t: 'Al acertar, Liz escribe la regla en lenguaje matemático. Es lo que hay que recordar.',
    aun: 'Sale debajo de la cuenta.'},
  {sel: '#voz', otro: '#botones', tit: 'Nicoleta y Migas', t: 'Nicoleta da pistas, nunca la cifra. Migas comenta desde el borde. Nick asoma a sumar: no le hagas caso.',
    aun: 'Hablan aquí debajo, cuando toca.'}
]);

raiz.Entrevistas.registra('nicoleta', [
  {id: 'n1', p: '¿Por qué funciona la regla de tres?', r: 'Porque no es una cruz: son <b>dos pasos</b>. Cinco pasteles, 3 €. Primero uno: 3 : 5 = 0,60 €. Luego ocho: 8 · 0,60 = 4,80 €. Las dos cuentas seguidas son «3 · 8 : 5», y eso es la cruz. Un atajo, que vale mientras la proporción sea directa.', pose: 'habla'},
  {id: 'n1b', tras: 'n1', p: '¿Y en el horno?', r: 'En el horno la cruz sale al revés. Con dos hornos, 3 horas. Con cuatro, la cruz dice 6, y son 1,5. Por eso aquí se enseñan los pasos antes que la cruz.', pose: 'senala'},
  {p: '¿Por qué rebajar el 20 % es multiplicar por 0,8?', r: 'El precio entero es el 100 %. Quitas el 20 y queda el <b>80 %</b>: la cosa por 80/100, o sea, por 0,8. Y subir el 20 es llegar al 120: por 1,2. De ahí sale que dos carteles no se suman y que, para volver, se divide.', pose: 'habla'},
  {p: '¿Por qué el 25 % de 8 es 8 · 25/100?', r: 'Porque el 25 % es 25 de cada 100: la fracción 25/100. Y la fracción de una cantidad es la cantidad por el de arriba entre el de abajo, como los tres cuartos de 12. Aquí el de abajo es siempre cien. Y como 25/100 es un cuarto, el 25 % de 8 es <b>un cuarto de 8: 2</b>.', pose: 'senala'},
  {p: '¿Nueve ayudantes hacen el bizcocho nueve veces más deprisa?', r: 'No. La inversa dice que, si el trabajo se reparte de verdad, el doble de manos tarda la mitad. Pero el horno tarda lo que tarda y la masa reposa lo que reposa. La inversa es <b>un modelo</b>: antes de usarla, mira si el trabajo se reparte. Eso no se demuestra: se dice. Y yo lo digo.', pose: 'piensa'},
  {p: '¿De verdad no mira nunca la ficha?', r: 'La miro para que la vea Liz. Yo sé lo que no cambia: huevo y medio por taza.', pose: 'celebra'}
], {cartel: 'La pastelera, con las manos en la masa', hola: 'Pregunta, que tengo las manos en la masa.'});
raiz.Entrevistas.registra('liz', [
  {p: '¿Qué es un titular?', r: 'La regla, en una línea y sin dibujo. Lo que queda cuando se retira el horno y la receta: <b>y = k · x</b>. Si cabe en un titular, cabe en un examen.', pose: 'apunta'},
  {p: '¿Por qué lleva siempre la cámara?', r: 'Por el flash. Cada vez que alguien acierta, foto. Mañana sale en el periódico.', pose: 'foto'},
  {p: '¿Qué ha aprendido en la pastelería?', r: 'Dos cosas. Que se pasa por la unidad, y que siempre se pregunta «¿el 20 % de qué?». Con eso hago el reportaje y la compra.', pose: 'habla'},
  {p: '¿Y la regla de tres del colegio?', r: 'La guardo. Pero ya sé por qué funciona, y ya sé cuándo no: en el horno sale al revés.', pose: 'senala'}
], {cartel: 'La periodista, con la libreta abierta', hola: 'Liz Stillo, del periódico. ¿Me deja la libreta abierta?'});
raiz.Entrevistas.registra('migas', [
  {p: '¿Por qué te llamas Migas?', r: 'Porque el 100 % de las migas son mías. Lo he comprobado.', pose: 'celebra'},
  {p: '¿Qué es eso de «de cada cien»?', r: 'La tarta tiene cien cuadraditos. El cartel dice 25. Yo me como uno y quedan 24, y ya no es el 25 %. Por eso me riñen.', pose: 'habla'},
  {p: '¿Qué haces con la fresa?', r: '¿Qué fresa? Yo no he visto ninguna fresa.', pose: 'sorpresa'},
  {p: '¿El 10 % de 250 gramos son 10 gramos?', r: 'Eso dije yo. Diez de cada cien gramos: de 250, son 25. Me comí los 25.', pose: 'piensa'}
], {cartel: 'El ratón del obrador, desde el borde de la mesa', hola: '¿Es para mí? Nunca me preguntan. ¿Lleva algo de comer?'});
raiz.Entrevistas.registra('nick', [
  {p: '¿Qué es «sumar como Nick»?', r: 'Es cuando me dicen que, para seis magdalenas más, hay que poner seis huevos más, y las magdalenas salen de piedra. Yo sumo. Mi hermana multiplica. Por eso ella hace tartas y yo pizzas.', pose: 'sorpresa'},
  {p: '¿Y los carteles de las rebajas?', r: 'Veinte y diez, treinta. Me dicen que no, que el segundo es de otro precio. Lo he grapado para que no se muevan.', pose: 'grapa'},
  {p: '¿Le cae bien Liz?', r: 'Me ha hecho una foto enharinado. Salgo en el periódico. Sí.', pose: 'celebra'}
], {cartel: 'El de la pizzería, con la grapadora', hola: 'Vengo a grapar presupuestos. ¿Hay que sumar algo?'});
raiz.Entrevistas.registra('inspector', [
  {id: 'c1', p: '¿Qué apunta en la carpeta?', r: 'Los fallos que veo en el obrador, cada uno con su nombre. Casi todos son de tres familias: <b>sumar</b> donde se multiplica, <b>la cruz</b> donde no toca y <b>la parte por el todo</b>. Pregúnteme por cualquiera.', pose: 'revisa'},
  {id: 'c1b', tras: 'c1', p: '¿Y por qué les pone nombre?', r: 'Porque un fallo con nombre se reconoce. Si le digo «eso es sumar como Nick», ya sabe qué mirar. Y en el acta, su profesor ve dónde tropieza cada uno.', pose: 'mira'},
  {p: '¿Qué es sumar donde se multiplica?', r: 'Tres huevos para doce magdalenas. Para dieciocho, Nick pone 3 + 6 = 9: <b>Sumar como Nick</b>. Pero dieciocho son una vez y media doce, y los huevos, también: 3 · 1,5 = 4,5. De la misma familia son <b>Los carteles se suman</b> y <b>Volver sumando</b>: en lo proporcional se multiplica, o se divide para deshacer, pero no se suma.', pose: 'mira'},
  {p: '¿Cuándo no toca la cruz?', r: 'Cuando la proporción no es directa. Un horno, seis horas; con dos hornos, la cruz dice doce, y son tres: <b>La cruz en el horno</b>. Antes de cruzar, pregunte si, al subir una, la otra sube o baja. Y si no van a la par, como los grados del horno y el tiempo, no hay cruz que valga: <b>Doblar los grados</b>.', pose: 'revisa'},
  {p: '¿Y la parte por el todo?', r: 'Pasa con los porcentajes. El 10 % de 250 gramos no son 10 gramos: son 25. Eso es <b>El tanto es la parte</b>. Y si el 30 % son 12 tartas, el total no puede salir 3,6, menos que la parte: <b>El tanto de la parte</b>. Pregunte siempre: ¿el tanto por ciento de qué?', pose: 'mira'},
  {p: '¿Y en las rebajas?', r: 'Por 0,2 sale lo que se quita, no lo que se paga: <b>Por el descuento</b>. Y para saber lo que valía antes, la rebaja se deshace dividiendo entre 0,8. Si se vuelve a multiplicar, sale menos todavía: <b>Rebajar otra vez</b>.', pose: 'revisa'},

function ficha(cont, api, op){
  const Rc = MAGDALENAS, yo = {n: Rc.base, nick: false, escrito: {}, horneado: false};
  cont.innerHTML = '<div class="rc-obrador">' +
    '<div class="rc-ficha" role="group" aria-label="La ficha de la receta"><i class="rc-chincheta" aria-hidden="true"></i>' +
      '<div class="rc-fcab"><b class="rc-ftit">' + Rc.nombre + '</b><span class="rc-para">para <output class="rc-n" aria-live="polite">' + Rc.base + '</output></span><span class="rc-sello" hidden></span></div>' +
      '<div class="rc-mandos" role="group" aria-label="Escalar la receta">' + MANDOS.map(x => '<button type="button" class="rc-mando" data-m="' + x.m + '" aria-label="' + x.a + '">' + x.t + '</button>').join('') + '</div>' +
      '<ul class="rc-ings">' + Rc.ings.map((g, i) => '<li class="rc-ing" data-i="' + i + '"><span class="rc-cant"></span><span class="rc-ud">' + g.ud.replace(/^(\S+)(.*)$/, '<span>$1</span><span class="rc-ud2">$2</span>') + '</span><span class="rc-iconos" role="img"></span></li>').join('') + '</ul>' +
      '<span class="rc-grapa" hidden aria-hidden="true"></span>' +
    '</div>' +
    '<div class="rc-hornada" aria-label="El horno: los moldes de doce"><div class="rc-moldes"></div><span class="rc-humo" hidden aria-hidden="true"><i></i><i></i><i></i></span></div>' +
  '</div>';
  const $ = s => cont.querySelector(s);
  const filas = [...cont.querySelectorAll('.rc-ing')];
  const visto = {};
  const bien = (g, n) => g.c * n / Rc.base;
  const deNick = (g, n) => g.c + (n - Rc.base);
  function pintaFila(i){
    const g = Rc.ings[i], li = filas[i], n = yo.n, cant = li.querySelector('.rc-cant'), ic = li.querySelector('.rc-iconos');
    let v = null, clase = '';
    if(yo.nick){ v = deNick(g, n); clase = 'nick'; }
    else if(n === Rc.base){ v = g.c; clase = 'dato'; }
    else if(yo.escrito[n] && yo.escrito[n][g.id] != null){ v = yo.escrito[n][g.id]; clase = 'escrito'; }
    li.className = 'rc-ing ' + (clase || 'blanco');
    if(v == null){
      if(g.id === 'huevos') cant.innerHTML = '<span class="rc-q" aria-label="sin escribir">?</span>';
      else if(!cant.querySelector('input')) cant.innerHTML = '<input class="rc-in" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="' + g.ud + ' para ' + n + ' (si quieres)" placeholder="?">';
      ic.innerHTML = ''; ic.setAttribute('aria-label', g.ud + ': sin escribir');
      visto[i] = null; return;
    }
    cant.textContent = cifra(v);
    if(visto[i] !== v + clase){
      ic.innerHTML = iconos(g.d, v, Math.floor(v) <= caben(ic, g.d) + 1 ? TOPE : caben(ic, g.d));
      if(clase !== 'dato' || visto[i] !== undefined) ic.querySelectorAll('.rc-ico').forEach((x, k) => { x.style.animationDelay = (k * 45) + 'ms'; x.classList.add('rc-pop'); sinPop(x, 'rc-pop'); });
      visto[i] = v + clase;
    }
    ic.setAttribute('aria-label', cifra(v) + ' ' + g.ud);
  }
  function pintaMoldes(){
    const est = yo.nick ? 'piedra' : yo.horneado ? 'subida' : 'capsula';
    $('.rc-moldes').innerHTML = D.moldes(yo.n, est);
    $('.rc-moldes').className = 'rc-moldes t' + Math.ceil(yo.n / 12);
    $('.rc-humo').hidden = !yo.nick;
    $('.rc-hornada').setAttribute('aria-label', 'El horno: ' + yo.n + ' magdalenas, ' + (yo.nick ? 'de piedra' : yo.horneado ? 'subidas' : 'sin hornear'));
    if(est === 'subida') cont.querySelectorAll('.rc-cupula').forEach((x, k) => { x.style.animationDelay = (120 + k * 35) + 'ms'; });
  }
  function pintaMandos(){
    cont.querySelectorAll('.rc-mando').forEach(b => { const x = MANDOS.find(z => z.m === b.dataset.m), v = x.f(yo.n); b.disabled = !CANTIDADES.includes(v); });
  }
  yo.pinta = () => { $('.rc-n').textContent = yo.n; filas.forEach((_, i) => pintaFila(i)); pintaMoldes(); pintaMandos(); $('.rc-grapa').hidden = !yo.nick; $('.rc-ficha').classList.toggle('con-nick', yo.nick); };
  $('.rc-n').addEventListener('click', () => {
    if(yo.n !== MAGDALENAS.base || !api.hallazgo) return;
    const o = $('.rc-n'); o.textContent = MAGDALENAS.base + 1; api.hallazgo('docena');
    setTimeout(() => { if(yo.n === MAGDALENAS.base) o.textContent = yo.n; }, 1800);
  });
  yo.pon = n => {
    if(!CANTIDADES.includes(n) || n === yo.n) return;
    yo.n = n; yo.nick = false; yo.horneado = !!(yo.escrito[n] && yo.escrito[n].huevos != null);
    $('.rc-sello').hidden = true;
    filas.forEach(li => { li.querySelector('.rc-cant').innerHTML = ''; });
    pop($('.rc-para'));
    api.sonido('clic');
    yo.pinta();
    if(op.alCambiar) op.alCambiar(n);
  };
  yo.escribe = (id, v) => { yo.nick = false; (yo.escrito[yo.n] = yo.escrito[yo.n] || {})[id] = v; yo.pinta(); };
  yo.hornea = () => { yo.nick = false; yo.horneado = true; yo.pinta(); };
  yo.sello = t => { const s = $('.rc-sello'); s.textContent = t; s.hidden = false; pop(s); };
  yo.trampa = () => { yo.nick = true; yo.pinta(); pop($('.rc-grapa'), 'rc-grapazo'); };
  cont.querySelector('.rc-mandos').addEventListener('click', ev => {
    const b = ev.target.closest('.rc-mando'); if(!b || b.disabled) return;
    yo.pon(MANDOS.find(z => z.m === b.dataset.m).f(yo.n));
  });
  cont.querySelector('.rc-ings').addEventListener('keydown', ev => {
    if(ev.key === 'Enter' && ev.target.classList.contains('rc-in')){ ev.preventDefault(); ev.stopPropagation(); revisa(ev.target); }
  });
  cont.querySelector('.rc-ings').addEventListener('change', ev => { if(ev.target.classList.contains('rc-in')) revisa(ev.target); });
  cont.querySelector('.rc-ings').addEventListener('input', ev => {
    const i = ev.target; if(!i.classList.contains('rc-in')) return;
    const v = i.value.replace(/\./g, ',').replace(/[^0-9,]/g, ''); if(v !== i.value) i.value = v;
    i.classList.remove('mal');
  });
  function revisa(inp){
    const v = R.numero(inp.value); if(v == null) return;
    const i = +inp.closest('.rc-ing').dataset.i, g = Rc.ings[i], n = yo.n;
    if(casi(v, bien(g, n))){ yo.escribe(g.id, v); api.dice('nicoleta', '<b>' + cifra(v) + ' ' + g.ud + '</b>: por lo mismo que las magdalenas. Eso es.', {pose: 'celebra'}); return; }
    inp.classList.remove('mal'); void inp.offsetWidth; inp.classList.add('mal');
    if(casi(v, deNick(g, n))) aDosVoces(api, 'nick-suma', '«' + cifra(n - Rc.base) + ' magdalenas más, ' + cifra(n - Rc.base) + ' ' + g.ud + ' más.»',
      'Las ' + g.ud + ' no crecen <b>más</b> lo mismo, Nick: crecen <b>por</b> lo mismo que las magdalenas.');
    else api.falla(null, {pista: 'No cuadra. Las ' + g.ud.split(' ')[0] + ' crecen por lo mismo que las magdalenas: ' + Rc.base + ' → ' + n + '.'});
  }
  yo.pinta();
  return yo;
}

function montaEscalar(mesa, api, M){
  api.pide(M.pide);
  mesa.innerHTML = '<div class="rc-sitio"></div>' + cuentaHTML().replace('caja cuenta', 'caja cuenta rc-cuenta-corta');
  const F = ficha(mesa.querySelector('.rc-sitio'), api, {});
  const huevos = MAGDALENAS.ings[0];
  const pista = escalones(api, M.pistas);
  const r = api.renglones(mesa.querySelector('.rn'), {
    antes: () => F.n === M.meta ? null : {quien: 'nicoleta', falta: F.n === MAGDALENAS.base
    ? 'Primero, la ficha <b>para ' + M.meta + '</b>: usa los mandos de la receta.'
    : 'La ficha está para ' + F.n + ', y Liz quiere <b>' + M.meta + '</b>. Ajústala con los mandos.'},
    lineas: M.lineas,
    titular: M.titular,
    alLinea: k => {
      if(k === 0) F.sello(MAGDALENAS.base + ' · ' + cifra(M.factor));
      if(k === 1){ F.escribe('huevos', huevos.c * M.factor); F.hornea(); }
    },
    alFallar: info => {
      const v = info.valor;
      if(info.linea === 1 && casi(v, huevos.c + (M.meta - MAGDALENAS.base))) return aDosVoces(api, 'nick-suma', M.nick.frase, M.nick.replica);
      if(info.linea === 0 && M.factorMal && M.factorMal.some(x => casi(v, x))) return api.falla(null, {pista: 'No cuadra. ' + M.pistas[0]});
      pista(undefined, info.linea);
    },
    alAcabar: () => { api.acierta({titular: M.titular, dice: M.dice}); if(trampa) trampa.hidden = true; }
  });
  let trampa = null;
  trampa = api.boton('Sumar como Nick', () => {
    if(F.n === MAGDALENAS.base){ api.dice('nick', '¿Para doce? Para doce ya está la ficha. Cambia las magdalenas y verás cómo lo grapo.', {pose: 'grapa'}); return; }
    const d = F.n - MAGDALENAS.base, txt = d > 0 ? cifra(d) + ' más' : cifra(-d) + ' menos';
    F.trampa(); api.sonido('plof');
    api.dice('nick', '¡' + txt.charAt(0).toUpperCase() + txt.slice(1) + ' magdalenas, ' + txt + ' de todo! Lo grapo.', {pose: 'grapa'});
    const h = huevos.c + d;
    setTimeout(() => {
      if(!api.sigue() || !F.nick) return;
      api.dice('nicoleta', 'Mira el horno: <b>de piedra</b>. ' + (h > 0 ? cifra(h) + ' huevos para ' + F.n : 'Huevos en negativo') +
        ': se ha roto la razón. Lo que crecen las magdalenas no se <b>suma</b>; se <b>multiplica</b>.', {pose: 'brazos'});
    }, 2400);
  }, {id: 'rcTrampa'});
  if(M.nickAsoma) setTimeout(() => { if(api.sigue() && !r.linea && !api.resuelta) api.dice('nick', M.nickAsoma, {pose: 'grapa'}); }, 900);
  return {
    tecla(ev){
      if(ev.target && /INPUT|BUTTON/.test(ev.target.tagName)) return;
      if(ev.key === '+' || ev.key === 'ArrowUp'){ ev.preventDefault(); F.pon(F.n + 6); }
      if(ev.key === '-' || ev.key === 'ArrowDown'){ ev.preventDefault(); F.pon(F.n - 6); }
    }
  };
}

const EN_VITRINA = 12;
function mostrador(cont, api, op){
  const yo = {k: 0};
  cont.innerHTML = '<div class="caja rc-mostrador' + (op.caja ? ' con-caja' : '') + '"><h4>El mostrador</h4><div class="rc-most">' +
    '<div class="rc-colgadas"><div class="rc-colgada">' + D.etiqueta('5 pasteles', '3,00 €') + '</div>' +
    (op.caja ? '<div class="rc-regalo">' + D.caja() + '<div class="rc-colgada chica">' + D.etiqueta('la caja', '1,00 € fija', {chica: true}) + '</div></div>' : '') + '</div>' +
    '<div class="rc-lado">' +
      '<div class="rc-vitrina" role="group" aria-label="La vitrina: toca un pastel para ponerlo en la bandeja"></div>' +
      '<div class="rc-bandeja" role="group" aria-label="La bandeja"><span class="rc-cuantos" aria-live="polite">0</span><div class="rc-enbandeja"></div>' + (op.caja ? '<span class="rc-mascaja">+ caja</span>' : '') + '</div>' +
    (op.tabla || '') + '</div></div><div class="rc-ticket" hidden></div></div>';
  const vit = cont.querySelector('.rc-vitrina'), ban = cont.querySelector('.rc-enbandeja');
  const boton = (donde, i) => '<button type="button" class="rc-pastel" data-donde="' + donde + '" aria-label="' + (donde === 'v' ? 'Poner un pastel en la bandeja' : 'Devolver un pastel a la vitrina') + '">' + D.pastel() + '</button>';
  function pinta(nuevo){
    vit.innerHTML = Array.from({length: EN_VITRINA - yo.k}, (_, i) => boton('v', i)).join('') || '<span class="rc-vacia">vacía</span>';
    ban.innerHTML = Array.from({length: yo.k}, (_, i) => boton('b', i)).join('');
    cont.querySelector('.rc-cuantos').textContent = yo.k;
    if(nuevo === 'b' && ban.lastElementChild) pop(ban.lastElementChild, 'rc-llega');
    cont.querySelector('.rc-mostrador').classList.toggle('completo', yo.k === op.meta);
    if(op.alCambiar) op.alCambiar(yo.k);
  }
  const mueve = donde => {
    if(op.quieto && op.quieto()) return;
    if(donde === 'v' && yo.k < EN_VITRINA){ yo.k++; pinta('b'); api.sonido('tecla'); }
    else if(donde === 'b' && yo.k > 0){ yo.k--; pinta('v'); api.sonido('tecla'); }
  };
  let arr = null;
  cont.addEventListener('click', ev => {
    const b = ev.target.closest('.rc-pastel'); if(!b) return;
    if(arr && arr.movido){ arr = null; return; }
    arr = null; mueve(b.dataset.donde);
  });
  cont.addEventListener('pointerdown', ev => {
    const b = ev.target.closest('.rc-pastel'); if(!b || ev.button > 0) return;
    arr = {b, x: ev.clientX, y: ev.clientY, movido: false, fantasma: null, id: ev.pointerId};
  });
  const sigue = ev => {
    if(!arr || ev.pointerId !== arr.id) return;
    if(!arr.movido && Math.hypot(ev.clientX - arr.x, ev.clientY - arr.y) < 8) return;
    if(!arr.movido){
      arr.movido = true;
      arr.fantasma = document.createElement('div'); arr.fantasma.className = 'rc-fantasma'; arr.fantasma.innerHTML = D.pastel();
      document.body.appendChild(arr.fantasma); arr.b.classList.add('rc-cogido');
      try{ arr.b.setPointerCapture(ev.pointerId); }catch(e){}
    }
    arr.fantasma.style.left = ev.clientX + 'px'; arr.fantasma.style.top = ev.clientY + 'px';
    ev.preventDefault();
  };
  const suelta = ev => {
    if(!arr || ev.pointerId !== arr.id) return;
    if(arr.movido){
      arr.fantasma.remove(); arr.b.classList.remove('rc-cogido');
      const sobre = document.elementFromPoint(ev.clientX, ev.clientY), zona = sobre && sobre.closest('.rc-bandeja,.rc-vitrina');
      if(zona && ((arr.b.dataset.donde === 'v' && zona.classList.contains('rc-bandeja')) || (arr.b.dataset.donde === 'b' && zona.classList.contains('rc-vitrina')))) mueve(arr.b.dataset.donde);
      setTimeout(() => { arr = null; }, 0);
    }else arr = null;
  };
  cont.addEventListener('pointermove', sigue);
  cont.addEventListener('pointerup', suelta);
  cont.addEventListener('pointercancel', ev => { if(arr && arr.fantasma) arr.fantasma.remove(); if(arr) arr.b.classList.remove('rc-cogido'); arr = null; });
  yo.ticket = html => { const t = cont.querySelector('.rc-ticket'); t.innerHTML = html; t.hidden = false; pop(t, 'rc-llega'); };
  yo.quita = () => { if(arr && arr.fantasma) arr.fantasma.remove(); };
  pinta();
  return yo;
}

  'doblar': ['24 = 12 · [2]', 'huevos = 3 · 2 = [6]'],
  'uno-y-medio': ['18 = 12 · [1,5]', 'huevos = 3 · 1,5 = [4,5]'],
  'no-cambia': ['para 24: huevos = [6]', 'para 18: huevos = [4,5]', 'para 6: huevos = [1,5]'],
  'no-cambia.razon': ['3 : 12 = [0,25]', '6 : 24 = [0,25]', '4,5 : 18 = [0,25]', '1,5 : 6 = [0,25]'],
  'etiqueta': ['1 pastel = 3 : 5 = [0,60] €', '8 pasteles = 8 · 0,60 = [4,80] €'],
  'kilo': ['1000 g = 200 g · [5]', 'el kilo = 1,20 · 5 = [6,00] €'],
  'cruz': ['3 · 8 : 5 = (3 : [5]) · [8]', '= [0,60] · 8 = [4,80]'],
  'caja': ['10 · 0,60 + 1 = [7,00]', '20 · 0,60 + 1 = [13,00]', '2 · 4,00 = [8,00]']
};
const TIT = {
  'doblar': 'huevos = 2 · 3 = 6<br>el doble de magdalenas, el doble de huevos',
  'uno-y-medio': 'huevos = 1,5 · 3 = 4,5<br>escalar es multiplicar, nunca sumar',
  'no-cambia': 'huevos : magdalenas = 0,25<br>se hagan las que se hagan: la razón no cambia<br>y = 0,25 · x',
  'etiqueta': 'precio de 8 = 8 · (3 : 5) = 4,80 €<br>para pasar de 5 a 8, se pasa por 1',
  'kilo': '1 kg = 5 · 200 g → 5 · 1,20 = 6,00 €<br>el precio del kilo sale de la razón euros : kilos',
  'cruz': '3 · 8 : 5 = (3 : 5) · 8<br>la cruz es el atajo de pasar por la unidad, y solo en la directa',
  'caja': '2 · 4,00 ≠ 7,00<br>con caja no es proporcional<br>euros = 0,60 · pasteles + 1<br>no es de la forma y = k · x',
  'sin-mirar': 'y = k · x<br>k es la razón, y no cambia'
};

function montaTabla(mesa, api){
  api.pide('Para el titular: al escalar, ¿qué es <b>lo que no cambia</b>? Rellena la tabla.');
  const COL = [12, 24, 18, 6], H = [3, 6, 4.5, 1.5];
  const conHuevos = v => cifra(v) + '<span class="rc-tico" aria-hidden="true">' + iconos('huevo', v) + '</span>';
  const celdas = fila => COL.map((c, i) => '<td data-f="' + fila + '" data-i="' + i + '">' + (fila === 'm' ? c : fila === 'h' && i === 0 ? conHuevos(3) : '<span class="rc-q">?</span>') + '</td>').join('');
  mesa.innerHTML = '<div class="caja rc-tapa"><h4>La receta en filas</h4><table class="rc-tabla">' +
    '<tr><th scope="row"><span class="rc-mini">' + D.magdalena() + '</span>magdalenas</th>' + celdas('m') + '</tr>' +
    '<tr><th scope="row"><span class="rc-mini">' + D.huevo() + '</span>huevos</th>' + celdas('h') + '</tr>' +
    '<tr class="rc-razon" hidden><th scope="row">huevos : magdalenas</th>' + celdas('r') + '</tr></table></div>' +
    reglaHTML() + cuentaHTML();
  const td = (f, i) => mesa.querySelector('td[data-f="' + f + '"][data-i="' + i + '"]');
  const llena = (f, i, t) => { const c = td(f, i); c.innerHTML = t; c.classList.add('lleno'); pop(c); };
  const regla = api.regla(mesa.querySelector('.rg'), {
    aria: 'Regla doble: magdalenas arriba, huevos abajo; 12 magdalenas son 3 huevos',
    max: 24, paso: 6, a: {t: 'magdalenas', m: [[0, '0'], [6, '6'], [12, '12'], [18, '18'], [24, '24']]},
    b: {t: 'huevos', m: [[0, '0'], [6, '?'], [12, '3'], [18, '?'], [24, '?']]}, une: [6, 12, 18, 24]
  });
  const pista1 = escalones(api, ['Seis magdalenas son la mitad de doce.', 'Veinticuatro es el doble de doce; dieciocho, uno y medio.', 'Lo que se hace a las magdalenas se hace a los huevos.']);
  const nickTabla = (v, i) => (i === 1 && casi(v, 15)) || (i === 2 && casi(v, 9)) || (i === 3 && (casi(v, -3) || casi(v, 0)));
  const fase1 = mesa.querySelector('.rn');
  mesa.querySelector('.cuenta').classList.add('rc-una', 'rc-siempre');
  api.renglones(fase1, {
    lineas: LINEAS['no-cambia'],
    alLinea: k => { llena('h', k + 1, conHuevos(H[k + 1])); regla.revela('b', COL[k + 1], cifra(H[k + 1])); },
    alFallar: info => {
      const i = info.linea + 1, v = info.valor;
      if(nickTabla(v, i)){
        if(i === 3) return aDosVoces(api, 'nick-suma', '«Seis magdalenas menos, seis huevos menos.»', 'Seis magdalenas son la <b>mitad</b> de doce, Nick: no se quitan seis huevos, se parten.');
        return aDosVoces(api, 'nick-suma', i === 1 ? '«Doce más, doce huevos más: quince.»' : '«Seis más, seis huevos más: nueve.»',
          'Doce magdalenas más no son doce huevos más, Nick. Lo que se hace a las magdalenas (<b>por</b> algo) se hace a los huevos.');
      }
      pista1();
    },
    alAcabar: fase2
  });
  function fase2(){
    const fila = mesa.querySelector('.rc-razon'); fila.hidden = false; pop(fila);
    api.dice('nicoleta', 'Ahora, en cada columna, <b>huevos entre magdalenas</b>.', {pose: 'senala'});
    const nueva = document.createElement('div'); nueva.className = 'rn';
    fase1.replaceWith(nueva);
    const pista2 = escalones(api, ['Divide los huevos entre las magdalenas en cada columna.', '¿Sale lo mismo en todas? Eso es lo que no cambia.']);
    api.renglones(nueva, {
      lineas: LINEAS['no-cambia.razon'],
      alLinea: k => { llena('r', k, '0,25'); if(k === 0) api.calla(); },
      alFallar: info => casi(info.valor, COL[info.linea] / H[info.linea]) ? api.falla(null, {pista: 'Al revés: <b>huevos entre magdalenas</b>, no magdalenas entre huevos.'}) : pista2('No cuadra: huevos entre magdalenas.'),
      alAcabar: () => {
        mesa.querySelector('.rc-razon').classList.add('igual');
        api.acierta({titular: TIT['no-cambia'],
          dice: 'Las cuatro columnas, <b>0,25</b>: un huevo de cada cuatro magdalenas. Se escale como se escale, <b>la razón no cambia</b>.'});
      }
    });
  }
}

function montaEtiqueta(mesa, api){
  api.pide('La etiqueta dice <b>cinco pasteles, 3 €</b>. Yo quiero <b>ocho</b>. ¿Cuánto pago?');
  mesa.innerHTML = '<div class="rc-sitio"></div>' + cuentaHTML();
  const M = mostrador(mesa.querySelector('.rc-sitio'), api, {meta: 8});
  const pista = escalones(api, ['Primero uno. Tres euros entre cinco pasteles.', 'Sesenta céntimos cada uno. Ahora, ocho de esos.', 'Ocho veces sesenta céntimos.'], [0, 1]);
  const r = api.renglones(mesa.querySelector('.rn'), {
    antes: () => M.k === 8 ? null : {quien: 'liz', falta: M.k < 8 ? 'Yo quiero <b>ocho</b>: ponlos primero en la bandeja (tócalos o arrástralos).' : 'Son muchos: yo quiero <b>ocho</b>.'},
    lineas: LINEAS.etiqueta,
    alFallar: info => {

}

const PRECIOS = [5, 8, 10, 12, 20, 25], REBAJAS = [-10, -20, -25, -50], SUBIDAS = [10, 20, 50];
const DOS = [[-20, -10], [-20, 20], [-50, 50], [10, -10]];
const FINALES = [8, 16, 18, 20, 24, 30, 36];
const factor = d => (100 + d) / 100;
const limpio = (x, dec) => Math.abs(x * Math.pow(10, dec) - Math.round(x * Math.pow(10, dec))) < 1e-6;
const tipoTarta = v => v >= 20 ? 'fresa' : v >= 12 ? 'nueces' : v >= 10 ? 'chocolate' : 'limon';
const cartelDe = d => (d > 0 ? '+' : '−') + Math.abs(d) + ' %';
const pick = (L, azar) => L[Math.floor(azar() * L.length)];

function ejCartel(v, cs){
  if(cs.length === 1){
    const d = cs[0], k = factor(d), p = v * k, sube = d > 0;
    return {
      enunciado: 'La tarta vale <b>' + eu(v) + ' €</b> y le cuelgan el cartel <b>' + cartelDe(d) + '</b>. ¿Cuánto vale ahora?',
      quien: 'liz', clave: 'c' + v + '·' + d, v, cs, final: p,
      regla: reglaPrecio({aria: 'Regla doble: ' + eu(v) + ' euros son el 100 por ciento', max: Math.max(100, 100 + d), paso: 10,
        a: [[100, eu(v)], [100 + d, '?']], b: [[100, '100'], [100 + d, String(100 + d)]], une: [100, 100 + d], arcos: [[100, 100 + d, '· ' + fa(k)]]}),
      renglones: {
        lineas: ['factor = (100 ' + (sube ? '+' : '−') + ' ' + Math.abs(d) + ') : 100 = [' + fa(k) + ']', 'precio = ' + eu(v) + ' · ' + fa(k) + ' = [' + cifra(p, 2) + '] €'],
        pistas: ['Si ' + (sube ? 'sube' : 'se quita') + ' el ' + Math.abs(d) + ', ¿a qué tanto ' + (sube ? 'llega' : 'queda') + '? En decimal.', 'El precio, por el factor.'],
        titular: (sube ? 'subir el ' : 'rebajar el ') + Math.abs(d) + ' %: final = ' + fa(k) + ' · antes<br>' + eu(v) + ' · ' + fa(k) + ' = ' + eu(p),
        diagnostica: diagnostico([[0, null, Math.abs(d) / 100, 'por-el-descuento'], [1, null, v * Math.abs(d) / 100, 'por-el-descuento'], [1, null, v + d, 'tanto-parte']])
      }
    };
  }
  const [d1, d2] = cs, k1 = factor(d1), k2 = factor(d2), p1 = v * k1, p2 = p1 * k2, k12 = k1 * k2, suma = 1 + (d1 + d2) / 100;
  return {
    enunciado: 'La tarta vale <b>' + eu(v) + ' €</b>. Le cuelgan <b>' + cartelDe(d1) + '</b> y, después, <b>' + cartelDe(d2) + '</b>. ¿Cuánto vale ahora?',
    quien: 'liz', clave: 'd' + v + '·' + d1 + '·' + d2, v, cs, final: p2,
    regla: reglaPrecio({aria: 'Regla doble de dos carteles seguidos: ' + eu(v) + ' euros son el 100 por ciento', max: Math.max(100, 100 + d1, 100 * k12), paso: 10,
      a: [[100, eu(v)], [100 + d1, '?'], [+(100 * k12).toFixed(2), '?']], b: [[100, '100'], [100 + d1, String(100 + d1)], [+(100 * k12).toFixed(2), '?']],
      une: [100, 100 + d1, +(100 * k12).toFixed(2)], arcos: [[100, 100 + d1, '· ' + fa(k1)], [100 + d1, +(100 * k12).toFixed(2), '· ' + fa(k2)]]}),
    renglones: {
      lineas: [eu(v) + ' · [' + fa(k1) + '] = [' + cifra(p1, 2) + '] €', eu(p1) + ' · [' + fa(k2) + '] = [' + cifra(p2, 2) + '] €', fa(k1) + ' · ' + fa(k2) + ' = [' + fa(k12) + ']'],
      pistas: ['El primer cartel: el precio por su factor.', 'El segundo cartel es del precio nuevo.', 'Los dos factores, multiplicados.'],
      titular: 'final = ' + fa(k2) + ' · (' + fa(k1) + ' · antes) = ' + fa(k12) + ' · antes<br>' + fa(k1) + ' · ' + fa(k2) + ' = ' + fa(k12) + (casi(k12, suma) ? '' : ' ≠ ' + fa(suma)) + '<br>los carteles seguidos se multiplican',
      diagnostica: diagnostico([[0, 0, Math.abs(d1) / 100, 'por-el-descuento'], [1, 0, Math.abs(d2) / 100, 'por-el-descuento'],
        [1, 1, v * suma, 'carteles-suman'], [2, null, suma, 'carteles-suman'], [0, 1, v + d1, 'tanto-parte']])
    }
  };
}
function ejAntes(f, d){
  const k = factor(d), a = f / k;
  return {
    enunciado: 'Con el <b>' + Math.abs(d) + ' % ya rebajado</b>, la tarta vale <b>' + eu(f) + ' €</b>. ¿Cuánto <b>valía</b>?',
    quien: 'liz', clave: 'a' + f + '·' + d, f, d, antes: true,
    regla: reglaPrecio({aria: 'Regla doble: ' + eu(f) + ' euros son el ' + (100 + d) + ' por ciento; el 100 por ciento, por calcular', paso: 10,
      a: [[100 + d, eu(f)], [100, '?']], b: [[100 + d, String(100 + d)], [100, '100']], une: [100 + d, 100],
      arcos: [[100, 100 + d, '· ' + fa(k)], {desde: 100 + d, hasta: 100, texto: ': ' + fa(k)}]}),
    renglones: {
      lineas: [eu(f) + ' = antes · [' + fa(k) + ']', 'antes = ' + eu(f) + ' : ' + fa(k) + ' = [' + cifra(a, 2) + '] €'],
      pistas: ['Lo que vale ahora es lo que queda: ¿qué tanto, en decimal?', 'Para deshacer el factor, se divide.'],
      titular: 'antes = ' + eu(f) + ' : ' + fa(k) + ' = ' + eu(a) + '<br>el precio de antes se divide entre el factor',
      diagnostica: diagnostico([[0, null, Math.abs(d) / 100, 'por-el-descuento'], [1, null, f * (1 - d / 100), 'volver-sumando'], [1, null, f * k, 'rebajar-otra-vez']])
    }
  };
}
const valeCartel = (v, cs) => v > 0 && v <= 1000 && cs.length >= 1 && cs.length <= 2 && cs.every(d => Number.isInteger(d) && d !== 0 && d >= -100 && d <= 200) &&
  limpio(v * cs.reduce((k, d) => k * factor(d), 1), 2) && limpio(v * factor(cs[0]), 2);
const valeAntes = (f, d) => f > 0 && f <= 1000 && Number.isInteger(d) && d < 0 && d > -100 && limpio(f / factor(d), 2);
const leeCs = c => String(c == null ? '' : c).replace(/[−–]/g, '-').split(',').filter(Boolean).map(x => /^\s*[-+]?\d{1,3}\s*$/.test(x) ? +x : NaN);
const precio = x => R.deEnlace(x, {min: .01, max: 1000, dec: 2});
function deEnlace(q){
  if(!q) return null;
  if(q.f != null){ const f = precio(q.f), d = leeCs(q.c)[0]; return f != null && valeAntes(f, d) ? ejAntes(f, d) : null; }
  if(q.v != null){ const v = precio(q.v), cs = leeCs(q.c); const ej = v != null && valeCartel(v, cs) ? ejCartel(v, cs) : null; if(ej && cs.includes(-100)) ej.hallazgo = 'gratis'; return ej; }
  return null;
}
function antesAlAzar(L, D, azar){
  for(let n = 0; n < 200; n++){ const f = pick(L, azar), d = -pick(D, azar); if(valeAntes(f, d)) return ejAntes(f, d); }
  return ejAntes(20, -20);
}
const conCapa = (ej, q) => { if(ej && q && /^(obrador|regla|renglones)$/.test(q.capa || '')) ej.capa = q.capa; return ej; };

function montaEjercicio(mesa, ej, api){

  mesa.innerHTML = (obrador ? '<div class="caja rb-caja rb-ancha"><h4>El escaparate</h4><div class="rb-cuerpo"><div class="rb-escena"></div><div class="rb-lado"></div></div></div>' : '') +
    (conRegla ? '<div class="caja rg-caja"><h4>' + api.T('regla.rotulo') + '</h4><div class="rg"></div></div>' : '') +
    '<div class="caja cuenta"><h4>' + api.T('cuenta.rotulo') + '</h4><div class="rn"></div></div>';
  let escena = null;
  if(obrador) escena = raiz.RebajasEscaparate.monta(mesa.querySelector('.rb-escena'), {tartas: [{tipo: tipoTarta(ej.v), precio: ej.v}],
    carteles: ej.cs.map(d => ({s: Math.sign(d), t: Math.abs(d)})), ranuras: ej.cs.length}, {reducido: api.reducido});
  if(conRegla) api.regla(mesa.querySelector('.rg'), ej.regla);
  const sp = ej.renglones, falla = fallador(api, (sp.pistas || []).map(p => [p]));
  api.renglones(mesa.querySelector('.rn'), Object.assign({}, sp, {
    alFallar: info => falla(info, info.error ? {id: info.error} : null),
    alAcabar: () => {
      if(escena){ escena.pon({tartas: [{tipo: tipoTarta(ej.v), precio: ej.v, nuevo: ej.final}]}); api.sonido('papel'); }
      api.acierta({titular: sp.titular});
    }
  }));
  return {desmonta(){}};
}

Pestanas.registra('rebajas', {

      },

      monta: montaEjercicio}

});
raiz.Rebajas = {M: [M1, M2, M3, M4, M5], CADENAS, ejCartel, ejAntes, deEnlace};

<script>
(function (raiz) {
'use strict';

const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

let vivo = null, token = 0, serie = null, reloj = 0;

const N_SERIE = 10;
function haceSerie(){
  const G = Pe.tipos().filter(t => t.serie !== false && typeof t.genera === 'function');
  if(!G.length) return null;
  const lista = []; let ant = null;
  for(let i = 0; i < N_SERIE; i++){
    let cand = G.filter(t => t !== ant); if(!cand.length) cand = G;
    const usos = t => lista.filter(x => x.tipo === t).length, min = Math.min(...cand.map(usos));
    cand = cand.filter(t => usos(t) === min);
    const t = cand[Math.floor(Math.random() * cand.length)];
    let ej = null;
    for(let k = 0; k < 20 && !ej; k++){ try{ ej = t.genera(est.dif, Math.random, null); }catch(e){ console.error(e); break; } if(ej && (!ej.renglones || lista.some(x => x.ej.clave && x.ej.clave === ej.clave))) ej = null; }
    if(ej){ lista.push({tipo: t, ej}); ant = t; }
  }
  return lista.length ? {lista, k: 0, aciertos: 0, t0: 0, fin: 0} : null;
}

    '<div class="actaDatos" id="acDatos"></div>' +
    '<p class="ac-linea" id="acSinMirar"></p><p class="ac-linea" id="acMas"></p>' +
    '<table class="actaTabla"><thead><tr><th>' + T('acta.pestana') + '</th><th>' + T('acta.misiones') + '</th><th>' + T('acta.primera') + '</th><th>' + T('acta.sinMirar') + '</th></tr></thead><tbody id="acFilas"></tbody></table>' +
    '<h3>' + T('acta.errores') + '</h3><div id="acErrores"></div>' +
    '<h3>' + T('acta.serie') + '</h3><div id="acSerie"></div>' +
    '<h3>' + T('acta.hallazgos') + '</h3><div id="acHallazgos"></div>' +
    '<div id="acNotas" class="ac-notas"></div>' +
    '<details class="ac-det" id="acDet"><summary>' + T('acta.detalle') + '</summary><ol class="ac-ej" id="acEj"></ol></details>' +
    '<div class="actaCodigos"><span class="etq">' + T('acta.codigo') + '</span><b id="acFirma"></b></div>' +
    '<p class="ac-sello64"><span class="etq">' + T('acta.sello') + '</span> <code id="acSello64"></code></p>' +
    '<div class="botones"><button type="button" class="b ok" id="acCopia">' + T('acta.copiar') + '</button><button type="button" class="b" id="acBaja">' + T('acta.bajar') + '</button><button type="button" class="b" id="acCierra">' + T('b.volver') + '</button></div>' +
    '<p class="actaMsg" id="acMsg" role="status"></p></div>';
  document.body.appendChild(d);
  $('acCierra').addEventListener('click', cierraActa);
  let toques = 0, tToques = 0;
  $('acSello').addEventListener('click', () => {
    toques++; clearTimeout(tToques); tToques = setTimeout(() => { toques = 0; }, 1800);
    if(toques >= 3 && raiz.Hallazgos){ toques = 0; cierraActa(); raiz.Hallazgos.abreFibonacci('el sello del oficio, tocado tres veces'); }
  });
  d.addEventListener('click', ev => { if(ev.target === d) cierraActa(); });
  $('acLista').addEventListener('input', () => { const x = $('acLista'); x.value = x.value.replace(/\D/g, ''); est.lista = x.value; guarda(); firmaActa(); });
  const texto = () => actaTexto + '\n\n' + T('acta.codigo') + ': ' + raiz.Acta.firma(actaTexto);
  $('acCopia').addEventListener('click', () => {
    const no = () => { $('acMsg').textContent = T('acta.noCopia'); };
    try{ navigator.clipboard.writeText(texto()).then(() => { $('acMsg').textContent = T('acta.copiada'); }, no); }catch(err){ no(); }
  });
  $('acBaja').addEventListener('click', () => {
    const f = new Date(), dos = x => String(x).padStart(2, '0');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([texto()], {type: 'text/plain;charset=utf-8'}));
    a.download = 'acta-pasteleria-' + (est.lista || 'sin-numero') + '-' + f.getFullYear() + dos(f.getMonth() + 1) + dos(f.getDate()) + '.txt';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    $('acMsg').textContent = T('acta.bajada');
  });
}
let actaTexto = '', actaAhora = 0;
function firmaActa(){
  actaTexto = raiz.Acta.texto(est, actaAhora);
  $('acFirma').textContent = raiz.Acta.firma(actaTexto);
  $('acSello64').textContent = raiz.Acta.sello64(est);
}
function pintaActa(){
  const A = raiz.Acta, r = A.resumen(est), dato = (n, v) => '<div><span class="etq">' + n + '</span><b>' + v + '</b></div>';
  actaAhora = Date.now();
  $('acSello').innerHTML = A.sello(r.oficio.fig) + '<b>' + esc(r.oficio.n) + '</b><small>' + esc(r.oficio.s) + '</small>';
  $('acSello').classList.toggle('oro', !!r.oficio.oro);
  const C = c => r.porCapa[c];
  $('acSinMirar').innerHTML = '<span class="etq">' + T('acta.sinMirar') + '</span> <b>' + r.limpias + ' de ' + r.hechas + '</b> <small>(' +
    [1, 2, 3].map(c => T('capa.' + c).replace(/^(el|la|los) /, '') + ' ' + C(c).limpias + '/' + C(c).hechas).join(' ◆ ') + ')</small>';
  const mas = [];
  if(r.trasFallos.length) mas.push(T('acta.trasFallos') + ': <b>' + r.trasFallos.length + '</b> <small>(' + esc(r.trasFallos.join(', ')) + ')</small>');
  if(r.fuera.length) mas.push(T('acta.fuera') + ': <small>' + esc(r.fuera.join(' ◆ ')) + '</small>');
  $('acMas').innerHTML = mas.join('<br>'); $('acMas').hidden = !mas.length;
  $('acHallazgos').innerHTML = '<p>' + (r.hallazgos.length ? '<b>' + r.hallazgos.length + ' de ' + r.nHallazgos + '</b> ◆ ' + r.hallazgos.map(h => esc(h.n)).join(' ◆ ') : '<span class="tenue">' + T('acta.hallazgos.nada', {n: r.nHallazgos}) + '</span>') + '</p>';
  const notas = A.notas(r);
  $('acNotas').innerHTML = notas.map(n => '<p class="nota-maquina">' + esc(n) + '</p>').join('');
  $('acDatos').innerHTML = dato(T('acta.misiones'), r.hechas + ' / ' + r.total) + dato(T('acta.primera'), r.primera) +
    dato(T('acta.sinMirarRegla'), r.sinMirar + ' / ' + r.conRegla) + dato(T('acta.practicar'), r.practicas.n) + dato(T('acta.tiempo'), A.tiempo(actaAhora - est.t0));
  $('acFilas').innerHTML = r.porPestana.map(p => '<tr><td><b>' + esc(p.nombre) + '</b></td><td>' + T('acta.deN', {a: p.hechas, n: p.total}) + '</td><td>' + p.primera + '</td><td>' + (p.conRegla ? T('acta.deN', {a: p.sinMirar, n: p.conRegla}) : T('acta.sinRegla')) + '</td></tr>').join('');
  $('acErrores').innerHTML = r.errores.length ? '<ul class="ac-errores">' + r.errores.map(e => '<li><b>' + esc(e.nombre) + '</b><span>× ' + e.n + '</span></li>').join('') + '</ul>' : '<p class="tenue">' + T('acta.errores.nada') + '</p>';
  const S = r.serie;
  const unaSerie = x => '<b>' + x.aciertos + '/' + x.total + '</b> ' + T('acta.serie.en') + ' <b>' + A.reloj(x.ms) + '</b> <small>(' + esc(A.dificultad(S.dif(x))) + ')</small>';
  $('acSerie').innerHTML = S.n ? '<p>' + T('acta.serie.mejor') + ': ' + unaSerie(S.mejor) + ' ◆ ' + T('acta.serie.ultima') + ': ' + unaSerie(S.ultima) + ' ◆ ' + T('acta.serie.total', {n: S.n}) + '</p>'
    : '<p class="tenue">' + T('acta.serie.nada') + '</p>';
  const ev = est.eventos || [];
  $('acDet').hidden = !ev.length;
  $('acDet').querySelector('summary').textContent = T('acta.detalle') + ' (' + ev.length + ')';
  $('acEj').innerHTML = ev.map(e => {
    const f = Pe.de(e.j), m = e.m && Pe.misionPorId(e.j, e.m), tp = e.p && Pe.tipo(e.j, e.p);
    return '<li class="' + (e.f ? 'no' : 'ok') + '"><span class="ac-h">' + A.hora(e.t) + '</span><span>' + esc(f ? f.nombre : e.j) + '</span><span class="ac-c">' +
      esc(m ? m.n + ' ◆ ' + (m.titulo || m.id) : tp ? T('practicar.titulo').toLowerCase() + ' ◆ ' + (tp.nombre || tp.id) : '') + '</span><span class="ac-como">' +
      (e.f ? T(e.f > 1 ? 'acta.fallos' : 'acta.fallo', {n: e.f}) : T('acta.alaPrimera')) + (e.sm === 1 ? ' ◆ ' + T('acta.sinMirar').toLowerCase() : '') + '</span></li>';
  }).join('');
  $('acLista').value = est.lista || '';
  firmaActa();
}
let actaDe = null;
function abreActa(){ ajustes(false); actaDe = document.activeElement; $('acMsg').textContent = ''; pintaActa(); $('mActa').hidden = false; $('mActa').querySelector('.caja2').focus(); }
function cierraActa(){ $('mActa').hidden = true; if(actaDe && actaDe.focus) actaDe.focus({preventScroll: true}); }

function montaAcciones(){
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T(e.dataset.t); });
  document.querySelectorAll('[data-ta]').forEach(e => e.setAttribute('aria-label', T(e.dataset.ta)));
  document.querySelectorAll('[data-tt]').forEach(e => e.setAttribute('title', T(e.dataset.tt)));
  $('bEntrevista').setAttribute('aria-label', T('accion.entrevistas'));
  $('bHistoria').addEventListener('click', () => { ajustes(false); raiz.Historia.abre(); });
  $('bHistoria').hidden = !raiz.Historia.hay();
  $('bGuia').addEventListener('click', abreGuia);
  $('bPracticar').addEventListener('click', () => { est.practica = !est.practica; serie = null; pintaReloj(); guarda(); pintaPestanas(); abre(); });
  $('bAjustes').addEventListener('click', () => ajustes($('ajustes').hidden));
  $('bAula').addEventListener('click', () => { aj.aula = !aj.aula; guardaAjustes(); aplicaAjustes(); });
  $('bActa').addEventListener('click', abreActa);
  $('bEntrevista').addEventListener('click', () => { ajustes(false); raiz.Entrevistas.abre(); });
  $('bEntrevista').hidden = !raiz.Entrevistas.lista().length;
  $('voz').addEventListener('click', ev => { if(!(ev.target.closest && ev.target.closest('.cara'))) $('voz').classList.toggle('entera'); });
  $('rtAtras').addEventListener('click', () => vivo && vivo.api.anterior());
  $('rtAdelante').addEventListener('click', () => vivo && vivo.api.siguiente());
  $('puntos').addEventListener('click', ev => { const b = ev.target.closest('button[data-mid]'); if(b) irA(b.dataset.mid); });
  $('prTipos').addEventListener('click', ev => { const b = ev.target.closest('button'); if(!b) return; Tu.de(est, est.pestana).tipo = b.dataset.t; serie = null; pintaReloj(); guarda(); abre(); });
  $('prDif').addEventListener('click', ev => { const b = ev.target.closest('button'); if(!b) return; est.dif = +b.dataset.d; guarda(); if(!serie) abre(); else pintaPractica(Pe.de(est.pestana), Pe.tipos(est.pestana)); });
  $('prSerie').addEventListener('click', () => { if(serie){ serie = null; clearInterval(reloj); pintaReloj(); abre(); } else empiezaSerie(); });
  addEventListener('keydown', ev => {
    if(ev.key === 'Escape'){ if(!$('mActa').hidden) return cierraActa(); if(!$('ajustes').hidden) return ajustes(false); }
    if(document.querySelector('.modal:not([hidden]),.guia:not([hidden]),.historia:not([hidden])') || html.dataset.inicio) return;
    if(ev.repeat && !/^Arrow/.test(ev.key)) return;
    if(vivo && vivo.montaje && typeof vivo.montaje.tecla === 'function') try{ vivo.montaje.tecla(ev); }catch(e){ console.error(e); }
  });
}
function abreGuia(fin){
  ajustes(false);
  const f = Pe.de(est.pestana);
  raiz.Guia.abre(f && f.guia || [], typeof fin === 'function' ? fin : null);
}

const abierta = () => document.querySelector('body > .modal:not([hidden]), body > .historia:not([hidden])');
document.addEventListener('focusin', ev => {
  const m = abierta();
  if(!m || m.contains(ev.target)) return;
  const dentro = m.querySelector('[role="dialog"]') || m.querySelector('button');
  if(dentro) dentro.focus({preventScroll: true});
});

montaAjustes(); aplicaAjustes(); montaPestanas(); montaAcciones(); montaActa();
pintaPestanas(); abre(); pintaReloj(); montada = true;
if(enlace && enlace.j && enlace.serie) empiezaSerie();
const vista = k => { try{ return localStorage.getItem(k) === 'vista'; }catch(err){ return true; } };
const primeraVez = de0 => {
  if(enlace && enlace.j && !de0) return;
  const guia = () => { if(!vista('nicoleta.guia')) setTimeout(abreGuia, 250); };
  if(!vista('nicoleta.historia') && raiz.Historia.hay()) raiz.Historia.abre(guia); else guia();
};
if(html.dataset.inicio === 'si' && raiz.Arranque) raiz.Arranque.inicia(primeraVez);
else{ delete html.dataset.inicio; primeraVez(); }

raiz.Pasteleria = {get est(){ return est; }, get vivo(){ return vivo; }, aj, abre, irA, empiezaSerie};
})(window);
</script>
</body>
</html>
